<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GRANDE TACTICS BOARD 3D v50</title>
<style>
  :root{
    --panel:rgba(10,18,15,.88);
    --line:rgba(217,182,74,.25);
    --gold:#d9b64a;
    --gold-dim:#8f7a3a;
    --txt:#e9e4d2;
    --txt-dim:#9aa08e;
    --chip:#16241d;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0b1210;
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;color:var(--txt)}
  #stage{position:fixed;inset:0;touch-action:none}
  canvas{display:block}
  header{
    position:fixed;top:0;left:0;right:0;z-index:10;
    display:flex;align-items:center;justify-content:space-between;
    padding:7px 14px;pointer-events:none;
    background:linear-gradient(180deg,rgba(5,10,8,.9),rgba(5,10,8,0));
  }
  .brand{display:flex;align-items:baseline;gap:8px}
  .brand b{font-size:13px;letter-spacing:.18em;color:var(--gold)}
  .brand span{font-size:9px;letter-spacing:.12em;color:var(--txt-dim)}
  #viewBadge{font-size:10px;letter-spacing:.15em;color:var(--txt-dim);
    border:1px solid var(--line);border-radius:999px;padding:4px 10px}
  #strip{
    position:fixed;bottom:8px;left:0;right:0;z-index:10;
    display:flex;align-items:center;gap:6px;
    padding:5px 12px;overflow-x:auto;scrollbar-width:none;
  }
  #strip::-webkit-scrollbar{display:none}
  #stripLabel{flex:0 0 auto;font-size:9px;letter-spacing:.1em;color:var(--txt-dim);
    display:flex;flex-direction:column;line-height:1.4}
  #stripLabel b{font-size:10px;color:var(--txt)}
  .numChip{
    flex:0 0 auto;position:relative;width:42px;height:46px;border-radius:10px;
    border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(6px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;transition:transform .12s,border-color .15s,background .15s;color:var(--txt);
  }
  .numChip .num{font-size:16px;font-weight:800;line-height:1}
  .numChip .role{font-size:8px;color:var(--txt-dim);margin-top:2px}
  .numChip.opp{background:rgba(240,240,240,.92);color:#1b1b1b;border-color:rgba(0,0,0,.15)}
  .numChip.opp .role{color:#666}
  .numChip.holder{
    border-color:var(--gold);background:#22301f;transform:translateY(-3px);
    box-shadow:0 4px 14px rgba(217,182,74,.35);
  }
  .numChip.opp.holder{background:#fff}
  .numChip.holder::after{
    content:"⚽";position:absolute;top:-9px;right:-6px;font-size:13px;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));
  }
  #zoneBar{
    position:fixed;bottom:64px;left:0;right:0;z-index:10;
    display:flex;gap:6px;padding:2px 12px;overflow-x:auto;scrollbar-width:none;
  }
  #zoneBar::-webkit-scrollbar{display:none}
  .zone{
    flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.04em;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:4px 9px;color:var(--txt-dim);backdrop-filter:blur(6px);
  }
  .zone b{margin-left:5px}
  .zone.adv b{color:#4bd680}
  .zone.dis b{color:#ff6b6b}
  .zone.even b{color:var(--txt-dim)}
  #panel{
    position:fixed;left:0;right:0;top:40px;z-index:10;
    display:grid;grid-template-columns:1fr 1fr;
    column-gap:14px;
    background:var(--panel);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:4px 12px 6px;
    max-height:52vh;overflow-y:auto;
  }
  #panelHandle{display:none}
  #presetRow{grid-column:1;grid-row:1}
  #toolRow{grid-column:2;grid-row:1}
  #displayRow{grid-column:1;grid-row:2}
  #camRow{grid-column:2;grid-row:2}
  #panel > .row:not(#presetRow):not(#toolRow):not(#displayRow):not(#camRow){
    grid-column:1 / span 2;
  }
  #panelHandle{
    display:flex;justify-content:center;align-items:center;gap:6px;
    height:18px;cursor:pointer;color:var(--txt-dim);font-size:10px;letter-spacing:.2em;
  }
  #panelHandle::before{content:"";width:34px;height:3px;border-radius:2px;background:var(--gold-dim)}
  .row{display:flex;align-items:center;gap:5px;margin-top:4px;overflow-x:auto;scrollbar-width:none}
  .row::-webkit-scrollbar{display:none}
  .lbl{flex:0 0 auto;font-size:10px;letter-spacing:.1em;color:var(--txt-dim);width:38px;font-size:9px}
  select{
    flex:0 0 auto;width:88px;min-width:0;appearance:none;background:var(--chip);color:var(--txt);
    border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:10px;font-weight:600;
  }
  .teamTag{flex:0 0 auto;font-size:10px;font-weight:700;padding:3px 7px;border-radius:5px}
  .teamTag.own{background:var(--gold);color:#12200f}
  .teamTag.opp{background:#e9e9e9;color:#222}
  .chip{
    flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--txt);
    border-radius:8px;padding:4px 8px;font-size:10px;font-weight:600;cursor:pointer;
    transition:background .15s,color .15s;
  }
  .chip.on{background:var(--gold);border-color:var(--gold);color:#12200f}
  .chip.ghost{border-style:dashed;color:var(--txt-dim)}
  .row.hidden{display:none}
  #oppDefRow.hidden{display:none}
  .hbtn{border:1px solid var(--line);background:var(--chip);color:var(--txt);
    border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer}
  .hbtn:disabled{opacity:.35;cursor:default}
  /* ===== ボトムシート(表示設定・シーン一覧) ===== */
  #uiOverlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:24;display:none}
  #uiOverlay.open{display:block}
  .usheet{
    position:fixed;right:10px;top:44px;z-index:25;
    width:min(300px,92vw);max-height:78vh;overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);
    border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.5);
    padding:14px;
    transform:translateY(-12px) scale(.97);opacity:0;pointer-events:none;
    transition:transform .18s ease,opacity .18s ease;
  }
  .usheet.open{transform:translateY(0) scale(1);opacity:1;pointer-events:auto}
  .ustitle{font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.1em;
    margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .usclose{border:none;background:var(--chip);color:var(--txt);border-radius:6px;
    padding:5px 10px;font-size:11px;cursor:pointer}
  .togRow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .usheet .hint{font-size:10px;color:var(--txt-dim);line-height:1.7;margin-top:10px}
  .srow{display:flex;align-items:center;gap:8px;padding:9px 4px;
    border-bottom:1px solid rgba(255,255,255,.07)}
  .srow .sname{flex:1;font-size:14px;font-weight:700}
  .srow .smeta{font-size:10px;color:var(--txt-dim)}
  .srow button{border:1px solid var(--line);background:var(--chip);color:var(--txt);
    border-radius:6px;padding:6px 10px;font-size:11px;cursor:pointer}
  /* ===== ネームバー(選択中の選手) ===== */
  #nameBar{
    position:fixed;left:50%;transform:translateX(-50%);z-index:9;
    bottom:140px;display:none;align-items:center;gap:10px;
    background:var(--panel);border:1px solid var(--gold);border-radius:999px;
    padding:7px 14px;backdrop-filter:blur(8px);
    box-shadow:0 4px 16px rgba(0,0,0,.5);white-space:nowrap;
  }
  #nameBar.show{display:flex}
  #nbNum{font-size:18px;font-weight:800;color:var(--gold)}
  #nbName{font-size:13px;font-weight:700}
  #nbHint{font-size:9px;color:var(--txt-dim)}
  #nbClose{border:none;background:var(--chip);color:var(--txt);border-radius:50%;
    width:22px;height:22px;font-size:11px;cursor:pointer}
  /* ===== シーンのコマチップ ===== */
  .fchip{
    flex:0 0 auto;width:34px;height:34px;border-radius:8px;
    border:1px solid var(--line);background:var(--chip);color:var(--txt);
    font-size:13px;font-weight:800;cursor:pointer;
  }
  .fchip.on{background:var(--gold);border-color:var(--gold);color:#12200f}
  /* ===== チュートリアル ===== */
  #tutorial{
    position:fixed;inset:0;z-index:40;display:none;
    align-items:center;justify-content:center;background:rgba(0,0,0,.72);
  }
  #tutorial.open{display:flex}
  .tbox{background:#101b14;border:1px solid var(--line);border-radius:16px;
    padding:22px;width:min(320px,86vw)}
  .tbox h3{color:var(--gold);font-size:15px;letter-spacing:.08em;margin-bottom:14px}
  .tbox p{font-size:12.5px;line-height:1.9;color:var(--txt);margin-bottom:10px}
  .tbox b{color:var(--gold)}
  .tbox button{width:100%;margin-top:8px;border:none;background:var(--gold);
    color:#12200f;font-weight:800;border-radius:10px;padding:12px;font-size:14px}
  #radar{
    position:fixed;right:10px;bottom:14px;z-index:9;display:none;
    border:1px solid var(--line);border-radius:10px;
    background:rgba(5,12,8,.78);backdrop-filter:blur(4px);
    box-shadow:0 4px 16px rgba(0,0,0,.4);
  }
  #editBox{
    position:fixed;inset:0;z-index:30;display:none;
    align-items:center;justify-content:center;background:rgba(0,0,0,.55);
  }
  #editBox.open{display:flex}
  .ebox{
    background:#101b14;border:1px solid var(--line);border-radius:14px;
    padding:16px;width:240px;display:flex;flex-direction:column;gap:10px;
  }
  .etitle{font-size:12px;letter-spacing:.1em;color:var(--gold);font-weight:700}
  .ebox input{
    background:var(--chip);border:1px solid var(--line);border-radius:8px;
    color:var(--txt);padding:9px 10px;font-size:15px;width:100%;
  }
  .ebtns{display:flex;gap:8px;justify-content:flex-end}
  .ebtns button{
    border:1px solid var(--line);background:var(--chip);color:var(--txt);
    border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;
  }
  .ebtns #editOk{background:var(--gold);border-color:var(--gold);color:#12200f}
  .numChip .role{max-width:38px;overflow:hidden;white-space:nowrap}
</style>
</head>
<body>

<div id="stage"></div>

<header>
  <div class="brand"><b>TACTICS BOARD</b><span>3D&nbsp;v50</span></div>
  <div id="viewBadge">2D ─ 真上</div>
  <button class="hbtn" id="undoBtn" style="opacity:.5" disabled>↩ 戻す</button>
</header>

<div id="strip">
  <div id="stripLabel">ボール保持<b id="stripTeam">自チーム</b></div>
</div>

<canvas id="radar"></canvas>

<div id="nameBar">
  <span id="nbNum">10</span>
  <span id="nbName">選手</span>
  <span id="nbHint">ピッチをタップで移動</span>
  <button id="nbClose">✕</button>
</div>

<div id="uiOverlay"></div>

<div class="usheet" id="recSheet">
  <div class="ustitle"><span>保存した録画</span><button class="usclose" data-uclose>閉じる</button></div>
  <div id="recList"></div>
</div>

<div class="usheet" id="scenesSheet">
  <div class="ustitle"><span>保存したシーン</span><button class="usclose" data-uclose>閉じる</button></div>
  <div id="scenesList"></div>
</div>

<div id="tutorial">
  <div class="tbox">
    <h3>⚽ TACTICS BOARD の使い方</h3>
    <p><b>ボード</b> ─ マッチアップ図。選手タップ→ピッチタップで動かす。描画ツールで矢印やエリアも書ける</p>
    <p><b>プレー</b> ─ ボール保持者を選んで味方をタップ=パス。局面を選ぶと22人が原理原則で連動</p>
    <p><b>シーン</b> ─ 配置を「＋追加」でコマ撮り→▶再生でアニメーション。保存すれば次の練習でも使える</p>
    <button id="tutClose">はじめる</button>
  </div>
</div>

<div id="editBox">
  <div class="ebox">
    <div class="etitle">選手の編集</div>
    <input id="editNum" type="number" min="1" max="99" placeholder="背番号">
    <input id="editName" type="text" maxlength="8" placeholder="名前 (任意)">
    <div class="row" style="margin:2px 0 0">
      <span class="lbl" style="width:auto">利き足</span>
      <button class="chip" id="editFootR">右</button>
      <button class="chip" id="editFootL">左</button>
    </div>
    <div class="ebtns">
      <button id="editCancel">キャンセル</button>
      <button id="editOk">OK</button>
    </div>
  </div>
</div>

<div id="panel">
  <div id="panelHandle">コントロール</div>

  <div class="row" id="presetRow">
    <span class="lbl">配置</span>
    <button class="chip on" data-bl="match">マッチアップ</button>
    <button class="chip" data-bl="kick">キックオフ</button>
    <button class="chip" data-bl="pressHigh">敵陣守備</button>
    <button class="chip" data-bl="halfDef">自陣守備</button>
  </div>

  <div class="row" id="displayRow">
    <span class="lbl">表示</span>
    <button class="chip on" data-mode="11">11人制</button>
    <button class="chip" data-mode="8">8人制</button>
    <button class="chip on" id="matchBtn">マッチアップ</button>
    <button class="chip on" id="unitBtn">ユニットライン</button>
    <button class="chip on" id="ringBtn">守備範囲</button>
    <button class="chip on" id="tagBtn">選手タグ</button>
    <button class="chip on" id="laneBtn">パスコース</button>
    <button class="chip on" id="stadiumBtn">スタジアム</button>
    <button class="chip" id="membersBtn">メンバー表</button>
    <button class="chip" id="notesBtn">練習ノート</button>
    <button class="chip" id="authBtn">ログイン</button>
    <button class="chip" id="rosterLoadBtn">名前読込</button>
    <button class="chip" id="simpleBtn">シンプル盤</button>
    <button class="chip on" id="defenseLiveBtn">守備連動</button>
    <button class="chip ghost" id="resetBtn">配置リセット</button>
  </div>


  <div class="row">
    <span class="lbl">システム</span>
    <span class="teamTag own">自</span>
    <select id="ownFormation"></select>
    <span class="teamTag opp">相手</span>
    <select id="oppFormation"></select>
  </div>

  <div class="row" id="phaseRow">
    <span class="lbl">局面</span>
    <button class="chip on" data-phase="buildup">自陣ビルドアップ</button>
    <button class="chip" data-phase="attack">敵陣攻撃</button>
    <button class="chip" data-phase="press">ハイプレス</button>
    <button class="chip" data-phase="mid">ミドルブロック</button>
    <button class="chip" data-phase="low">リトリート</button>
  </div>

  <div class="row" id="oppDefRow">
    <span class="lbl">相手の守備</span>
    <button class="chip on" data-oppdef="press">ハイプレス</button>
    <button class="chip" data-oppdef="mid">ミドルブロック</button>
    <button class="chip" data-oppdef="low">ローブロック</button>
  </div>

  <div class="row" id="recRow">
    <span class="lbl">録画</span>
    <button class="chip" id="recBtn">● 録画</button>
    <button class="chip" id="recPlayBtn" disabled>▶ 再生</button>
    <button class="chip" id="recSaveBtn" disabled>💾 保存</button>
    <button class="chip" id="recListBtn">📁 一覧</button>
    <span id="recStatus" style="font-size:10px;color:var(--txt-dim);align-self:center"></span>
  </div>

  <div class="row" id="toolRow">
    <span class="lbl">描画</span>
    <button class="chip" data-tool="arrow">ボールの動き</button>
    <button class="chip" data-tool="area">エリア</button>
    <button class="chip" data-tool="erase">消す</button>
    <button class="chip ghost" id="clearDrawBtn">全消し</button>
  </div>

  <div class="row hidden" id="sceneRow">
    <span class="lbl">シーン</span>
    <span id="frameChips" style="display:flex;gap:6px;flex:0 0 auto"></span>
    <button class="chip" id="addFrameBtn">＋追加</button>
    <button class="chip" id="updFrameBtn">更新</button>
    <button class="chip ghost" id="delFrameBtn">削除</button>
    <button class="chip" id="playSceneBtn">▶ 再生</button>
    <button class="chip" id="slowBtn">🐢 スロー</button>
    <button class="chip" id="saveSceneBtn">💾 保存</button>
    <button class="chip" id="listSceneBtn">📁 一覧</button>
  </div>

  <div class="row" id="camRow">
    <span class="lbl">視点</span>
    <button class="chip on" data-cam="top">2D 真上</button>
    <button class="chip" data-cam="fm">3D 俯瞰</button>
    <button class="chip" data-cam="goal">ゴール裏</button>
    <button class="chip" data-cam="side">サイド</button>
    <button class="chip" data-cam="tv">TV 中継</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>

   フォーメーション定義

 {n:1, r:"GK",slot:"gk",b:[50,6], a:[50,14]},

 {n:4, r:"DF",slot:"cb",b:[68,14],a:[62,44]},

 {n:8, r:"MF",slot:"cm",b:[62,34],a:[62,62]},

"3-2-2":[

 {n:4, r:"DF",slot:"cb",b:[50,13],a:[50,42]},

 {n:6, r:"MF",slot:"cm",b:[38,36],a:[38,64]},

 {n:10,r:"FW",slot:"st",b:[40,62],a:[42,85]},

function makePitchTexture(){
  const S=10; // 1m = 10px
  const W=PITCH.wid*S, H=PITCH.len*S;
  /* 11人制 / JFA 8人制(U-12)の公式マーキング寸法 */
  const cfg = PITCH.len===105
    ? {stripes:14, cc:91.5, paW:403, paD:165, gaW:183, gaD:55, spot:110, arcR:91.5}
    : {stripes:10, cc:70,   paW:290, paD:120, gaW:130, gaD:40, spot:80,  arcR:70};
  const c=document.createElement("canvas");
  c.width=W;c.height=H;
  const g=c.getContext("2d");
  const sh=H/cfg.stripes;
  for(let i=0;i<cfg.stripes;i++){g.fillStyle=i%2?"#2c7a41":"#347f48";g.fillRect(0,i*sh,W,sh+1);}
  g.strokeStyle="rgba(255,255,255,.92)";g.lineWidth=3;
  const inset=6;
  g.strokeRect(inset,inset,W-inset*2,H-inset*2);
  g.beginPath();g.moveTo(inset,H/2);g.lineTo(W-inset,H/2);g.stroke();
  g.beginPath();g.arc(W/2,H/2,cfg.cc,0,Math.PI*2);g.stroke();
  g.fillStyle="#fff";
  g.beginPath();g.arc(W/2,H/2,4,0,Math.PI*2);g.fill();
  const box=(y0,dir)=>{
    g.strokeRect(W/2-cfg.paW/2,y0,cfg.paW,cfg.paD*dir);
    g.strokeRect(W/2-cfg.gaW/2,y0,cfg.gaW,cfg.gaD*dir);
    const spotY=y0+cfg.spot*dir;
    g.beginPath();g.arc(W/2,spotY,4,0,Math.PI*2);g.fill();
    const a=Math.asin((cfg.paD-cfg.spot)/cfg.arcR);
    g.beginPath();
    if(dir>0)g.arc(W/2,spotY,cfg.arcR,a,Math.PI-a);
    else g.arc(W/2,spotY,cfg.arcR,Math.PI+a,Math.PI*2-a);
    g.stroke();
  };
  box(inset,1);box(H-inset,-1);
  const t=new THREE.CanvasTexture(c);
  t.anisotropy=8;
  return t;
}

let stadium=null;
function makeCrowdTex(){
  const c=document.createElement("canvas");c.width=512;c.height=256;
  const g=c.getContext("2d");
  g.fillStyle="#0c131d";g.fillRect(0,0,512,256);
  const cols=["#3a4456","#2c3342","#556077","#6b7488","#8a93a6","#d9b64a","#7a2e2e","#2e5d7a"];
  for(let y=6;y<256;y+=7){
    if(y%42<7){g.fillStyle="#080d14";g.fillRect(0,y-1,512,8);continue;}
    for(let x=2;x<512;x+=5){
      if(Math.random()<0.82){
        g.fillStyle=cols[(Math.random()*cols.length)|0];
        g.fillRect(x+((Math.random()*2)|0),y,3,4);
      }
    }
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=THREE.RepeatWrapping;
  t.repeat.set(4,1);
  return t;
}

function buildStadium(){
  if(stadium){
    scene.remove(stadium);
    stadium.traverse(o=>{
      if(o.geometry)o.geometry.dispose();
      if(o.material){if(o.material.map)o.material.map.dispose();o.material.dispose();}
    });
  }
  stadium=new THREE.Group();
  const W=PITCH.wid,L=PITCH.len;

  /* 観客席: 群衆テクスチャの傾いたスタンド×4 */
  const crowd=makeCrowdTex();
  const standMat=new THREE.MeshBasicMaterial({map:crowd});
  const stand=(w,px,pz)=>{
    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,20),standMat);
    m.position.set(px,7.5,pz);
    m.lookAt(0,-8,0);            // ピッチ側へ向けつつ後ろへ傾ける
    stadium.add(m);
  };
  stand(L+18, W/2+11, 0);
  stand(L+18, -(W/2+11), 0);
  stand(W+18, 0, L/2+11);
  stand(W+18, 0, -(L/2+11));

  /* 広告ボード(LED風) */
  const adMat=new THREE.MeshBasicMaterial({map:makeAdTex()});
  const ad=(w,px,pz,ry)=>{
    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,1),adMat);
    m.position.set(px,0.5,pz);
    m.rotation.y=ry;
    stadium.add(m);
  };
  ad(L, W/2+3.5, 0, -Math.PI/2);
  ad(L, -(W/2+3.5), 0, Math.PI/2);
  ad(W, 0, L/2+3.5, Math.PI);
  ad(W, 0, -(L/2+3.5), 0);

  /* 照明塔×4 */
  [[1,1],[1,-1],[-1,1],[-1,-1]].forEach(([sx,sz])=>{
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.55,26,8),
      new THREE.MeshLambertMaterial({color:0x1c242e}));
    pole.position.set(sx*(W/2+16),13,sz*(L/2+16));
    const head=new THREE.Mesh(new THREE.PlaneGeometry(6,3),
      new THREE.MeshBasicMaterial({color:0xeef4ff}));
    head.position.set(sx*(W/2+16),27,sz*(L/2+16));
    head.lookAt(0,0,0);
    stadium.add(pole,head);
  });

  /* ピッチ外周のアプロン */
  const apron=new THREE.Mesh(new THREE.PlaneGeometry(W+9,L+9),
    new THREE.MeshLambertMaterial({color:0x17301f}));
  apron.rotation.x=-Math.PI/2;apron.position.y=-0.03;
  stadium.add(apron);

  stadium.visible=state.stadium;
  scene.add(stadium);
}

/* 距離が近い順に1対1で組ませる。組めなかった選手=「浮いている選手」 */
function updateMatchup(){
  matchedSet.clear();
  if(!state.matchup){matchLines.visible=false;return;}
  const arr=matchGeo.attributes.position.array;
  let k=0;
  if(state.sel){
    /* 選択中の選手とその相手だけを線で結ぶ */
    const partner=markPartnerOf(state.sel);
    if(partner&&k+6<=arr.length){
      matchedSet.add(state.sel);matchedSet.add(partner);
      arr[k++]=state.sel.mesh.position.x;arr[k++]=1.0;arr[k++]=state.sel.mesh.position.z;
      arr[k++]=partner.mesh.position.x;arr[k++]=1.0;arr[k++]=partner.mesh.position.z;
    }
    matchGeo.setDrawRange(0,k/3);
    matchGeo.attributes.position.needsUpdate=true;
    matchLines.visible=true;
    return;
  }
  if(state.phase!=="base"){
    /* 動的モード: エンジンの担当表をそのまま表示。見えている線=実際の守備ロジック */
    players.forEach(d=>{
      if(!d.markT||k+6>arr.length)return;
      matchedSet.add(d);matchedSet.add(d.markT);
      arr[k++]=d.mesh.position.x;arr[k++]=1.0;arr[k++]=d.mesh.position.z;
      arr[k++]=d.markT.mesh.position.x;arr[k++]=1.0;arr[k++]=d.markT.mesh.position.z;
    });
  }else{
    /* 基本配置: 原則マーク(レーン×ラインの対応表)を表示。
       線が無い相手=構造的に浮く選手(リングが光る) */
    const dispDef="own";
    players.filter(p=>p.side===dispDef&&p.pMark).forEach(d=>{
      if(k+6>arr.length)return;
      matchedSet.add(d);matchedSet.add(d.pMark);
      arr[k++]=d.mesh.position.x;arr[k++]=1.0;arr[k++]=d.mesh.position.z;
      arr[k++]=d.pMark.mesh.position.x;arr[k++]=1.0;arr[k++]=d.pMark.mesh.position.z;
    });
  }
  matchGeo.setDrawRange(0,k/3);
  matchGeo.attributes.position.needsUpdate=true;
  matchLines.visible=true;
}

/* ========================= パスコース可視化 =========================
   ボール起点で各味方へのコースを判定。相手の守備範囲(約2.1m)が
   コース上にかかっていれば赤(消されている)、空いていれば緑。 */
const laneGeo=new THREE.BufferGeometry();
laneGeo.setAttribute("position",new THREE.BufferAttribute(new Float32Array(11*2*3),3));
laneGeo.setAttribute("color",new THREE.BufferAttribute(new Float32Array(11*2*3),3));
const laneLines=new THREE.LineSegments(laneGeo,
  new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.75}));
laneLines.renderOrder=4;
scene.add(laneLines);

function updateLanes(){
  if(!state.lanes){laneLines.visible=false;return;}
  let side=null;
  if(state.phase==="base"){
    let best=null,bd=1e9;
    players.forEach(p=>{
      const d=p.mesh.position.distanceTo(ball.position);
      if(d<bd){bd=d;best=p;}
    });
    side=(best&&bd<14)?best.side:null;
  }else side=PHASE[state.phase].poss;
  if(!side){laneLines.visible=false;return;}
  const mates=players.filter(p=>p.side===side);
  const foes=players.filter(p=>p.side!==side);
  const o=ball.position;
  const arr=laneGeo.attributes.position.array;
  const col=laneGeo.attributes.color.array;
  let k=0;
  mates.forEach(m=>{
    const t=m.mesh.position;
    const dx=t.x-o.x,dz=t.z-o.z;
    const len=Math.hypot(dx,dz);
    if(len<2.5||k+6>arr.length)return;
    let blocked=false;
    for(const f of foes){
      const fx=f.mesh.position.x-o.x,fz=f.mesh.position.z-o.z;
      const tp=(fx*dx+fz*dz)/(len*len);
      if(tp<=0.05||tp>=0.97)continue;
      const d=Math.hypot(f.mesh.position.x-(o.x+dx*tp),f.mesh.position.z-(o.z+dz*tp));
      if(d<2.1&&Math.hypot(fx,fz)>1.5){blocked=true;break;}
    }
    const r=blocked?0.85:0.28,g=blocked?0.3:0.85,b=blocked?0.3:0.5;
    arr[k]=o.x;arr[k+1]=0.3;arr[k+2]=o.z;
    arr[k+3]=t.x;arr[k+4]=0.3;arr[k+5]=t.z;
    col[k]=r;col[k+1]=g;col[k+2]=b;
    col[k+3]=r;col[k+4]=g;col[k+5]=b;
    k+=6;
  });
  laneGeo.setDrawRange(0,k/3);
  laneGeo.attributes.position.needsUpdate=true;
  laneGeo.attributes.color.needsUpdate=true;
  laneLines.visible=true;
}

const clamp=THREE.MathUtils.clamp;
const lerp2=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
function toWorld(x,y,side){

  if(side==="own")return new THREE.Vector3((x/100-0.5)*W,0,(y/100)*L-L/2);

  if(side==="own")return [(v.x/W+0.5)*100,(v.z+L/2)/L*100];

}

/* =========================================================
   ユニットライン・エンジン v5 (シミュレーションで形を検証済み)
   規則性のルール:
   ・各ラインは完全にフラットな1本のバンク(段差なし)
   ・ライン全体がボールへ強くスライドし、ボールサイドの端がボールに届く
   ・逆サイドは自動的に中央へ絞られる(スライドの結果として)
   ・マッチアップはゾーンを崩さない範囲で相手に寄る(最低間隔を常に維持)
   ・プレスは「自分の縦レーン」のボールに出る(レーン優先の距離計算)
   ・プレスに出たら同ラインの残りが等間隔に詰め直して穴を消す
========================================================= */
/* 基本配置(マッチアップ図): 役割ごとの標準深度 × テンプレの横位置。
   相手はミラー反転され、FWが相手DFの手前、中盤同士が中央で噛み合う。 */
function basePos(def){
  const s=def.slot;
  let y;
  if(s==="gk")y=4;
  else if(s==="cb")y=def.b[0]===50?19:22;
  else if(s==="sb")y=25;
  else if(s==="wb")y=def.r==="DF"?25:53;
  else if(s==="dm")y=42;
  else if(s==="cm")y=47;
  else if(s==="sm")y=47;
  else if(s==="am")y=56;
  else if(s==="wg")y=66;
  else y=69;
  return [def.b[0], y];
}
/* キックオフ: 両チームが自陣に整列 */
function kickPos(def){
  const s=def.slot;
  const t={gk:5,cb:14,sb:18,dm:26,cm:32,sm:33,am:40,wg:45,st:48};
  let y=t[s]??30;
  if(s==="wb")y=def.r==="DF"?18:34;
  return [def.b[0],y];
}
/* 自陣ブロック(リトリート形): ハーフコート守備の受け側 */
function lowPos(def){
  const s=def.slot;
  const t={gk:4,cb:12,sb:13,dm:20,cm:22,sm:23,am:26,wg:30,st:34};
  let y=t[s]??20;
  if(s==="wb")y=def.r==="DF"?13:24;
  return [def.b[0],y];
}
function highPos(def){
  const s=def.slot;
  const t={gk:14,cb:56,sb:58,dm:66,cm:70,sm:71,am:76,wg:83,st:86};
  let y=t[s]??66;
  if(s==="wb")y=def.r==="DF"?58:72;
  return [def.b[0],y];
}
function baseLayoutPos(p){
  const L=state.baseLayout;
  if(L==="kick")return kickPos(p.def);
  if(L==="pressHigh")return p.side==="own"?highPos(p.def):[p.def.b[0],p.def.b[1]];
  if(L==="halfDef")return p.side==="own"?lowPos(p.def):[p.def.a[0],p.def.a[1]];
  return basePos(p.def);
}

function applyDynamic(){
  /* ---- シーンモード: エンジン凍結(コマ撮り用の手動配置) ---- */
  if(state.ui==="scene"){
    ballTarget.copy(ballFree);
    return;
  }
  /* ---- 配置モード: 専用の軽量エンジン。
     プリセット座標(基準点)は不変のまま、そこから「マークへの追従」だけを
     毎フレーム加算する。局面判定(自陣ビルドアップ等)は一切使わないので、
     既存の動的エンジンとは干渉しない。 ---- */
  if(state.phase==="base"){
    applyBaseEngine();
    return;
  }
  const poss=PHASE[state.phase].poss;
  const defSide=poss==="own"?"opp":"own";
  const defBias=poss==="own"?BIAS[state.oppDef]:BIAS[PHASE[state.phase].ownDefBias];

  const defList=players.filter(p=>p.side===defSide);
  const attList=players.filter(p=>p.side===poss);
  /* 予測: パス飛行中はボールの現在地ではなく到達点を基準にする
     (ジグザグ走が消え、パスが出た瞬間に動き出す本物の守備になる) */
  const eb=flight?(flight.toP?flight.toP.mesh.position:flight.toV):ball.position;
  const [dbx,dby]=worldToFrame(eb,defSide);
  const u=dby;

  /* ---- 三層守備・第2層: マーク担当表 ----
     数フレームごとに守備者⇔攻撃者を1対1で割当。継続ボーナスで担当が粘り、
     ゾーンを大きく外れたら手放して隣が拾う(=受け渡し) */
  if(--markTick<=0){
    markTick=24;
    const dfs=defList.filter(p=>p.def.slot!=="gk");
    const ats=attList.filter(p=>p.def.slot!=="gk");
    const cost=[];
    dfs.forEach(d=>{
      const [dxF,dyF]=worldToFrame(d.mesh.position,defSide);
      ats.forEach(a=>{
        const [ax,ay]=worldToFrame(a.mesh.position,defSide);
        let c=Math.abs(ax-dxF)*1.3+Math.abs(ay-dyF)*0.7;
        if(d.markT===a)c-=4;
        if(d.pMark===a)c-=6;   // 原則マークを最優先(崩れた時だけ近さで応急対応)
        cost.push([c,d,a]);
      });
    });
    cost.sort((p,q)=>p[0]-q[0]);
    const ud=new Set(),ua=new Set();
    dfs.forEach(d=>d.markT=null);
    for(const e2 of cost){
      if(e2[0]>34)break;
      if(ud.has(e2[1])||ua.has(e2[2]))continue;
      ud.add(e2[1]);ua.add(e2[2]);
      e2[1].markT=e2[2];
    }
  }

  /* ---- ブロックの高さ(0=ハイプレス 1=リトリート) ---- */
  const s=clamp((100-u-15)/70+defBias,0,1);
  const backY =clamp(Math.min(40-28*s,u-4),4.5,62);
  const midY  =backY+(10-2*s);
  const frontY=midY +(9-2*s);
  const manW=clamp(0.75-defBias*0.5,0,1);   // 人寄り: press≈0.91 / mid=0.75 / low≈0.59

  /* ---- ライン定義 ---- */
  const grp=set=>defList.filter(p=>set.has(p.def.slot)).sort((a,b)=>a.def.b[0]-b.def.b[0]);
  const lines=[
    {members:grp(LINE1), y:backY,  slide:0.55, sp:11-2.5*s, mark:LINE3, xb:0.15, yb:0,          isBack:true},
    {members:grp(LINE2), y:midY,   slide:0.65, sp:12-3*s,   mark:LINE2, xb:0.15, yb:0,          isBack:false},
    {members:grp(LINE3), y:frontY, slide:0.60, sp:12-2*s,   mark:LINE1, xb:0.10+0.45*(1-s), yb:0.5*(1-s), isBack:false}
  ];

  lines.forEach(L=>{
    const n=L.members.length; if(!n)return;
    const width=L.sp*(n-1), half=width/2;
    const cx=clamp(50+(dbx-50)*L.slide, half+4, 96-half);
    const xs=[];
    L.members.forEach((m,i)=>{
      const homeX = n===1 ? cx : cx-half+L.sp*i;
      let x=homeX, y=L.y;
      /* 第2層: 担当マークの「ゴール側」に立つ。
         ボールがマークに近いほどタイト、遠いほど絞って中を締める。
         縦にも追従するのでFWが裏に走ればCBも下がる */
      const mk=m.markT;
      if(mk&&m!==state.presser){
        const mp=worldToFrame(mk.mesh.position,defSide);
        if(Math.abs(mp[0]-homeX)>L.sp*2.2){
          m.markT=null;                        // ゾーンを大きく出た→手放す(受け渡し)
        }else{
          const bd=mk.mesh.position.distanceTo(eb);
          const gap=clamp(2.2+bd*0.22,2.2,8)/(PITCH.len/100);
          const tx=mp[0]+(50-mp[0])*0.06;      // わずかに中を切る
          const ty=Math.max(mp[1]-gap,2);
          x=homeX+(tx-homeX)*manW;
          y=L.y+(ty-L.y)*manW;
        }
      }
      xs.push(x);
      m.fy=L.isBack?Math.min(y,u-3):y;
    });
    /* 第1層: ゾーンロック(人につく分だけ広げるが、持ち場は捨てない) */
    const lock=L.sp*(0.55+manW*0.75);
    for(let i=0;i<n;i++){
      const home=n===1?cx:cx-half+L.sp*i;
      xs[i]=clamp(xs[i],home-lock,home+lock);
    }
    /* 規則性の担保: 最低間隔を保ちながら並び順を維持 */
    const ms=L.sp*0.72;
    for(let i=1;i<n;i++)if(xs[i]<xs[i-1]+ms)xs[i]=xs[i-1]+ms;
    for(let i=n-2;i>=0;i--)if(xs[i]>xs[i+1]-ms)xs[i]=xs[i+1]-ms;
    L.members.forEach((m,i)=>m.fx=xs[i]);
  });

  /* ---- プレス: レーン優先(横のずれを重く評価)+ ヒステリシス ---- */
  const metric=p=>Math.sqrt((p.fx-dbx)*(p.fx-dbx)*1.2+(p.fy-u)*(p.fy-u)*0.5);
  const cands=defList.filter(p=>p.def.slot!=="gk");
  let best=null,bm=1e9;
  cands.forEach(p=>{const m=metric(p);if(m<bm){bm=m;best=p;}});
  const PRESS_MAX=19;   // これ以上遠いボールには出て行かない(持ち場優先)
  if(bm>PRESS_MAX){
    state.presser=null;
  }else if(!state.presser||state.presser.side!==defSide||
     metric(state.presser)>Math.min(bm*1.35+1.5,PRESS_MAX+3)){
    state.presser=best;
  }
  const presser=state.presser;
  if(presser){
    presser.fx=dbx;
    presser.fy=Math.max(u-(4.6+defBias*5.6)/(PITCH.len/100),2);
    /* 同ラインの残りを等間隔に詰め直す(チャレンジ&カバー) */
    const L=lines.find(l=>l.members.includes(presser));
    if(L){
      const rest=L.members.filter(m=>m!==presser);
      const n=rest.length;
      if(n){
        const width=L.sp*(n-1),half=width/2;
        const cx=clamp(50+(dbx-50)*L.slide,half+4,96-half);
        rest.forEach((m,i)=>m.fx=n===1?cx:cx-half+L.sp*i);
      }
    }
  }

  /* GK: ボールとゴールを結ぶ線上 */
  defList.filter(p=>p.def.slot==="gk").forEach(p=>{
    p.fx=50+(dbx-50)*0.22;
    p.fy=u<25?3.2:6;
  });

  /* ---- 攻撃側: 相手ライン基準のポジショナル配置 ----
     ・GK起点。CBは相手1列目の手前でボールを受けられる高さ
     ・SB/WBは相手1列目の外・脇
     ・ピボット(アンカー)は相手1列目と2列目の間
     ・インサイドMF/トップ下は「ライン間」(相手2列目と最終ラインの間)
     ・横方向は相手中盤の選手と選手の「間」に立つ(ギャップ取り)
     ・WGは幅を取って最終ラインをピン留め、CFはラストラインの肩 */
  const [abx,aby]=worldToFrame(eb,poss);
  const t=clamp((aby-15)/65,0,1);
  const avgY=set=>{
    const l=defList.filter(p=>set.has(p.def.slot));
    return l.length?l.reduce((sm,p)=>sm+p.fy,0)/l.length:55;
  };
  const oppFrontAtt=100-avgY(LINE3);   // 相手1列目(攻撃側座標)
  const oppMidAtt  =100-avgY(LINE2);   // 相手2列目
  const oppBackAtt =100-avgY(LINE1);   // 相手最終ライン
  const oppMidXs=defList.filter(p=>LINE2.has(p.def.slot)).map(p=>100-p.fx);
  const gapNudge=(x,blend)=>{
    if(!oppMidXs.length)return x;
    const xs=[...oppMidXs].sort((a,b)=>a-b);
    const gaps=[];
    for(let i=0;i<xs.length-1;i++)gaps.push((xs[i]+xs[i+1])/2);
    if(!gaps.length)return x;
    let best=x,bd=1e9;
    gaps.forEach(g=>{const d=Math.abs(g-x);if(d<bd){bd=d;best=g;}});
    return x+(best-x)*blend;
  };
  const mix=(structure,tmpl)=>structure*0.75+tmpl*0.25;
  attList.forEach(p=>{
    const sl=p.def.slot;
    let [x,y]=lerp2(p.def.b,p.def.a,t);
    x+=(abx-50)*TILT[sl];
    if(sl==="gk"){
      x=50+(abx-50)*0.3;
    }else if(sl==="cb"){
      y=Math.min(y,oppFrontAtt-4);
    }else if(sl==="sb"||(sl==="wb")){
      const lo=oppFrontAtt-2, hi=oppMidAtt-3;
      y=clamp(y,Math.min(lo,hi),Math.max(lo,hi));
    }else if(sl==="dm"){
      y=mix((oppFrontAtt+oppMidAtt)/2,y);
      x=gapNudge(x,0.5);
    }else if(sl==="cm"){
      y=mix(oppMidAtt+(oppBackAtt-oppMidAtt)*0.40,y);
      x=gapNudge(x,0.5);
    }else if(sl==="am"){
      y=mix(oppMidAtt+(oppBackAtt-oppMidAtt)*0.55,y);
      x=gapNudge(x,0.55);
    }else if(sl==="wg"){
      y=clamp(y,oppBackAtt-9,oppBackAtt-1);
    }else if(sl==="st"&&aby>25){
      y=clamp(y,oppBackAtt-7,oppBackAtt-1);
    }
    p.fx=x;p.fy=y;
  });

  /* ---- ワールド座標へ ---- */
  players.forEach(p=>{
    p.fx=clamp(p.fx,2,98);p.fy=clamp(p.fy,1,99);
    p.base.copy(toWorld(p.fx,p.fy,p.side));
  });

  /* 攻撃側のみ: 味方同士の距離確保(守備ラインは構造を優先し崩さない) */
  const list=attList;
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
    const a=list[i].base,b=list[j].base;
    const dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);
    if(d<4.2&&d>0.001){
      const push=(4.2-d)/2,nx=dx/d,nz=dz/d;
      a.x-=nx*push;a.z-=nz*push;b.x+=nx*push;b.z+=nz*push;
    }
  }
  players.forEach(p=>{
    if(!p.pb)p.pb=p.base.clone();
    if(p!==state.presser&&p!==state.holder&&p.base.distanceTo(p.pb)<0.8){
      p.base.copy(p.pb);          // 小さな揺れは追わない
    }else p.pb.copy(p.base);
    p.target.copy(p.base).add(p.manual);
  });

  if(state.holder){
    const h=state.holder;
    ballTarget.copy(h.target);
    const facing=h.figure?h.figure.rotation.y:0;
    const footSign=h.foot==="L"?-1:1;         // 利き足の外側にボールを表示
    const sideX=Math.cos(facing)*footSign*0.9;
    const sideZ=-Math.sin(facing)*footSign*0.9;
    const fwdX=Math.sin(facing)*1.1, fwdZ=Math.cos(facing)*1.1;
    ballTarget.x+=fwdX+sideX;
    ballTarget.z+=fwdZ+sideZ;
    ballTarget.y=0.45;
    ballFree.copy(ballTarget);
  }else{
    ballTarget.copy(ballFree);
  }
}

/* ========================= パス ========================= */
/* 配置モード専用エンジン
   1) チーム全体がボールへスライドする(ゾーン全体の反応)
   2) 原則マークを持つ選手はさらに担当へ個別追従する(人につく反応)
   両方が重なることで「全体が動きつつ、マークは特に強く反応する」感覚になる。 */
function currentPoss(){
  let side=null,bd=1e9;
  players.forEach(p=>{const d=p.mesh.position.distanceTo(ball.position);if(d<bd){bd=d;side=p.side;}});
  return side||"own";
}
function applyBaseEngine(){
  state.presser=null;
  /* 1) 全員をプリセットの基準位置に置く */
  players.forEach(p=>{
    const [x,y]=baseLayoutPos(p);
    p.base.copy(toWorld(x,y,p.side));
  });
  /* 2) チーム全体のゾーンスライド: ボールを持っていない側(守備側)が、
        ボールの横位置・深さへ全体でにじり寄る。持ち場の骨格は保ったまま。
        「守備連動」がOFFの時は完全にスキップし、純粋な配置エディタになる。 */
  const poss=currentPoss();
  /* シンプル盤/守備連動OFF: ゾーンスライド・自動プレスは行わず、
     ドラッグや長押し矢印などユーザーの明示的な操作にだけ反応する。
     (シンプル盤のマーク追従はドラッグ側 simpleFollow / execDraw が担当) */
  if(state.defenseLive&&!state.simple){
  ["own","opp"].forEach(side=>{
    if(side===poss)return;   // 攻撃側は個別のドラッグ操作のみに任せる
    const [bx,by]=worldToFrame(ball.position,side);
    const list=players.filter(p=>p.side===side);
    list.forEach(p=>{
      const [tx,ty]=worldToFrame(p.base,side);
      const slideX=(bx-tx)*0.16;                       // 横スライド
      const slideY=clamp((by-ty)*0.10,-6,6);            // 深さの追従(抑えめ)
      const w=toWorld(tx+slideX,ty+slideY,side);
      p.base.copy(w);
    });
  });
  /* 3) 「守備している側」だけが、担当のゴール側へさらに個別追従する。
        攻撃側は自分のマーク相手を追いかけない(綱引き状態を防ぐ)。
        追従量は基準位置からの距離でクランプ=持ち場は崩れない。 */
  const FOLLOW=9.5;   // これ以上離れたら追いきれず持ち場に留まる
  /* ボールを持っている選手を特定(そのマーカーはプレスに出る) */
  let holder=null,hd=2.2;
  players.forEach(p=>{
    const d=Math.hypot(p.mesh.position.x-ball.position.x,p.mesh.position.z-ball.position.z);
    if(d<hd){hd=d;holder=p;}
  });
  players.forEach(p=>{
    if(p.side===poss)return;   // 攻撃側は追従しない
    const mk=p.pMark;
    if(!mk)return;
    const gs=p.side==="own"?-2.2:2.2;
    if(mk===holder){
      /* プレス: 担当がボールを持っていたら寄せ切る。
         実際の移動速度(最大7.4m/s)は描画側で制限されるため、
         遠ければ全力で走り、近ければ間合いを取って止まる。 */
      const far=Math.hypot(mk.mesh.position.x-p.mesh.position.x,
                           mk.mesh.position.z-p.mesh.position.z);
      if(far<26){
        /* ドリブル操作中は張り付かず、少し離れてついていくだけにする */
        const gap=(mode==="dribble")?3.6:1.7;   // 寄せる間合い
        const press=p.side==="own"?-gap:gap;
        p.manual.set(0,0,0);                   // 古いオフセットとの二重加算を防ぐ
        p.runTo=null;
        p.runQueue=null;                       // 古い折れ線の経由点も残さない
        p.base.set(mk.mesh.position.x*0.97,0,
          clamp(mk.mesh.position.z+press,-PITCH.len/2+1,PITCH.len/2-1));
        state.presser=p;
        return;
      }
    }
    const want=new THREE.Vector3(mk.mesh.position.x*0.92,0,mk.mesh.position.z+gs);
    const dx=want.x-p.base.x, dz=want.z-p.base.z;
    const d=Math.hypot(dx,dz);
    if(d>0.05){
      /* 近いほどタイトに追従、FOLLOWに近づくほど緩める */
      const k=clamp(1-d/FOLLOW,0.25,0.85);
      p.base.x+=dx*k; p.base.z+=dz*k;
    }
  });
  }
  players.forEach(p=>{
    if(p.runTo){
      /* エンジンの走行指示: 基準位置や手動オフセットと加算せず、そこへ直行。
         到着したら次の経由点(runQueue)があればそこへ、無ければ解除して
         通常の配置ロジックに戻る(=折れ線を順にたどる)。 */
      p.target.copy(p.runTo);
      /* 経由点は減速圏(7.4/3.2≒2.3m)に入る手前で次へ切り替え、
         角で止まらずに走り抜ける。最終目的地だけ0.6mまで寄って停止 */
      const arriveR=(p.runQueue&&p.runQueue.length)?2.4:0.6;
      if(Math.hypot(p.mesh.position.x-p.runTo.x,p.mesh.position.z-p.runTo.z)<arriveR){
        if(p.runQueue&&p.runQueue.length){
          p.runTo=p.runQueue.shift();
        }else{
          p.runTo=null;
          p.manual.set(p.target.x-p.base.x,0,p.target.z-p.base.z);
        }
      }
    }else{
      p.target.copy(p.base).add(p.manual);
    }
  });
  applyFootOffset();
}

/* 見た目上のボール保持者(足元近くにいる選手)を検出し、
   利き足の外側+進行方向に表示位置をオフセットする(配置モードでも常時有効) */
function applyFootOffset(){
  let holder=null,bd=1.6;
  players.forEach(p=>{
    const d=Math.hypot(p.target.x-ballFree.x,p.target.z-ballFree.z);
    if(d<bd){bd=d;holder=p;}
  });
  ballHolder=holder;
  if(!holder||mode==="ball"||mode==="dribble"){ ballTarget.copy(ballFree); return; }
  /* 向きは「攻撃方向」で固定する。選手の見た目の向き(figure.rotation)を使うと
     選手はボールを向く→ボールが向きに合わせて動く→また向き直す…と
     無限に回り続けてしまうため、その循環を断ち切る。 */
  const facing=holder.side==="own"?0:Math.PI;
  const footSign=holder.foot==="L"?-1:1;
  const sideX=Math.cos(facing)*footSign*0.75, sideZ=-Math.sin(facing)*footSign*0.75;
  const fwdX=Math.sin(facing)*0.75, fwdZ=Math.cos(facing)*0.75;
  ballTarget.set(holder.target.x+fwdX+sideX,0.45,holder.target.z+fwdZ+sideZ);
}

function findDefaultHolder(){
  const ph=PHASE[state.phase];
  return players.find(p=>p.side===ph.poss&&ph.holder.includes(p.def.slot))||
         players.find(p=>p.side===ph.poss);
}
function passTo(p){
  if(state.phase==="base"||state.ui==="scene")return;
  if(!p||p===state.holder)return;
  if(p.side!==PHASE[state.phase].poss)return;
  if(state.holder)passEffect(state.holder.target,p.target);
  const d=ball.position.distanceTo(p.mesh.position);
  flight={
    t0:performance.now(),
    dur:clamp(d/16,0.25,1.5)*1000,
    from:ball.position.clone(),
    toP:p, toV:null,
    h:clamp(d*0.10,0.25,3.2)
  };
  /* 守備の連動プレビュー: このパスで相手全員がどこへスライドするか */
  const poss=PHASE[state.phase].poss;
  const savedB=ball.position.clone();
  ball.position.copy(p.mesh.position);
  applyDynamic();
  const fut=players.filter(q=>q.side!==poss).map(q=>({q,t:q.target.clone()}));
  ball.position.copy(savedB);
  applyDynamic();
  fut.forEach(({q,t})=>{
    if(q.mesh.position.distanceTo(t)>2.5){
      const geo=new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(q.mesh.position.x,0.9,q.mesh.position.z),
        new THREE.Vector3(t.x,0.9,t.z)]);
      const line=new THREE.Line(geo,
        new THREE.LineBasicMaterial({color:0x6fd3ff,transparent:true,opacity:0.85}));
      scene.add(line);
      effects.push({line,life:1});
    }
  });
  state.holder=p;
  renderStrip();
}
function seedBall(){
  if(state.phase==="base"){
    ballFree.set(0,0.45,0);
    ball.position.copy(ballFree);
    ballTarget.copy(ballFree);
    return;
  }
  const h=state.holder;if(!h)return;
  const key={buildup:"b",attack:"a",press:"b",mid:null,low:"a"}[state.phase];
  const xy=key===null?lerp2(h.def.b,h.def.a,0.5):h.def[key];
  const w=toWorld(xy[0],xy[1],h.side);
  ball.position.set(w.x,0.45,w.z);
  ballTarget.copy(ball.position);
  ballFree.copy(ball.position);
}

/* ========================= 背番号ストリップ ========================= */
const strip=document.getElementById("strip");
function renderStrip(){
  strip.querySelectorAll(".numChip").forEach(e=>e.remove());
  if(state.phase==="base"){
    document.getElementById("stripTeam").textContent="基本配置(マッチアップ図)";
    return;
  }
  const poss=PHASE[state.phase].poss;
  document.getElementById("stripTeam").textContent=poss==="own"?"自チーム":"相手チーム";
  players.filter(p=>p.side===poss).forEach(p=>{
    const d=document.createElement("div");
    d.className="numChip"+(poss==="opp"?" opp":"")+(p===state.holder?" holder":"");
    d.innerHTML=`<span class="num">${p.num}</span><span class="role">${p.name||p.def.r}</span>`;
    let lp=null,lpFired=false;
    d.addEventListener("pointerdown",()=>{
      lpFired=false;
      lp=setTimeout(()=>{lpFired=true;showGhost(p);},380);
    });
    const endLp=()=>{clearTimeout(lp);hideGhost();};
    d.addEventListener("pointerup",endLp);
    d.addEventListener("pointerleave",endLp);
    d.addEventListener("click",()=>{
      if(lpFired){lpFired=false;return;}   // 長押し後のクリックはパスしない
      passTo(p);
    });
    strip.appendChild(d);
  });
}

/* ========================= カメラ ========================= */
const CAM_PRESETS={
  top :{radius:150,phi:0.10,theta:Math.PI,  ty:0,tz:0, badge:"2D ─ 真上"},
  fm  :{radius:98, phi:0.92,theta:Math.PI,  ty:0,tz:-7,badge:"3D ─ 俯瞰"},
  goal:{radius:90, phi:1.24,theta:Math.PI,  ty:2,tz:-4,badge:"3D ─ ゴール裏"},
  side:{radius:84, phi:1.02,theta:Math.PI/2,ty:0,tz:0, badge:"3D ─ サイド"},
  tv  :{radius:90, phi:1.02,theta:Math.PI/2,ty:0,tz:0, badge:"TV ─ 中継カメラ"}
};
const camCur={radius:170,phi:0.4,theta:Math.PI,ty:0,tz:0};
const tvS={z:0,lx:0,lz:0};   // 放送カメラの遅れ追従用
const camGoal={...CAM_PRESETS.top};
const lookAt=new THREE.Vector3();
function fitTop(){
  const fovR=camera.fov*Math.PI/180;
  const aspect=innerWidth/innerHeight;
  const panel=document.getElementById("panel");
  const blockedTop=40+panel.offsetHeight;
  const blockedBottom=14;   // 下部ストリップ+数的バー
  const usable=Math.max(220,innerHeight-blockedTop-blockedBottom);
  const distV=((PITCH.len/2+4)/Math.tan(fovR/2))*(innerHeight/usable);
  const distH=(PITCH.wid/2+3)/(Math.tan(fovR/2)*aspect);
  const radius=Math.min(Math.max(distV,distH),420);
  const worldPerPx=2*radius*Math.tan(fovR/2)/innerHeight;
  const tz=((blockedTop-blockedBottom)/2)*worldPerPx;
  return {radius,tz};
}
function setCam(name){
  const p={...CAM_PRESETS[name]};
  if(name==="top")Object.assign(p,fitTop());
  else p.radius*=PITCH.len/105;
  Object.assign(camGoal,p);
  document.getElementById("viewBadge").textContent=p.badge;
}
function updateCamera(){
  if(state.cam==="tv"){
    /* 放送カメラ: ボールに遅れてつき、進行方向を先読みし、逆サイドでは引く */
    tvS.z +=(ball.position.z*0.78-tvS.z)*0.045;
    tvS.lx+=(ball.position.x*0.50-tvS.lx)*0.07;
    tvS.lz+=(ball.position.z*0.88-tvS.lz)*0.07;
    const d=PITCH.wid/2+24+Math.max(0,ball.position.x)*0.5;
    camera.position.set(-d, 15+PITCH.len*0.03, tvS.z);
    camera.lookAt(tvS.lx,1.2,tvS.lz);
    return;
  }
  const k=0.075;
  camCur.radius+=(camGoal.radius-camCur.radius)*k;
  camCur.phi+=(camGoal.phi-camCur.phi)*k;
  camCur.theta+=(camGoal.theta-camCur.theta)*k;
  camCur.ty+=(camGoal.ty-camCur.ty)*k;
  camCur.tz+=(camGoal.tz-camCur.tz)*k;
  const sp=Math.sin(camCur.phi);
  camera.position.set(
    camCur.radius*sp*Math.sin(camCur.theta),
    camCur.radius*Math.cos(camCur.phi),
    camCur.tz+camCur.radius*sp*Math.cos(camCur.theta)
  );
  lookAt.set(0,camCur.ty,camCur.tz);
  camera.lookAt(lookAt);
}

/* ========================= 入力 ========================= */
const ray=new THREE.Raycaster();
const ndc=new THREE.Vector2();
const floorPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
const pointers=new Map();
let mode=null,dragPlayer=null,lastPinch=0,downAt=0,moved=0;
let lastT=performance.now();
let flight=null;   // パス中のボール軌道
let markTick=0;    // 担当割当の再計算タイマー
let lastTap={p:null,t:0};
let editTarget=null;
function openEditor(p){
  editTarget=p;
  document.getElementById("editNum").value=p.num;
  document.getElementById("editName").value=p.name;
  $("#editFootR").classList.toggle("on",p.foot!=="L");
  $("#editFootL").classList.toggle("on",p.foot==="L");
  document.getElementById("editBox").classList.add("open");
}

function setNDC(e){ndc.x=(e.clientX/innerWidth)*2-1;ndc.y=-(e.clientY/innerHeight)*2+1;}
function pickPlayer(){
  ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(players.map(p=>p.hit))[0];
  return hit?players.find(p=>p.hit===hit.object):null;
}
const el=renderer.domElement;
el.addEventListener("pointerdown",e=>{
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  downAt=performance.now();moved=0;
  if(pointers.size===2){mode="pinch";lastPinch=pinchDist();dragPlayer=null;return;}
  setNDC(e);
  ray.setFromCamera(ndc,camera);
  /* 描画ツールが有効ならピッチへの入力は描画に */
  if(state.tool!=="none"){
    const pt=new THREE.Vector3();
    if(ray.ray.intersectPlane(floorPlane,pt)){
      if(state.tool==="erase"){eraseAt(pt);mode=null;return;}
      mode="draw";
      drawStart=[pt.x,pt.z];
    }
    return;
  }
  const p=pickPlayer();
  const onBall=ray.intersectObject(ballHit).length>0;
  /* 選択中の選手がボールを持っている場合、ボール上をつかんでも
     「ボールだけドラッグ」ではなく必ずドリブルになるよう最優先で判定する */
  /* ボールを持っている選手(またはボール本体)を掴んだら常にドリブル。
     事前の選択は不要。 */
  let ballOwner=null,bo=3.0;
  players.forEach(q=>{
    const d=q.mesh.position.distanceTo(ball.position);
    if(d<bo){bo=d;ballOwner=q;}
  });
  const dribbleReady = ballOwner && (p===ballOwner || (onBall && ballOwner));
  if(dribbleReady && p!==ballOwner) setSel(ballOwner);
  else if(dribbleReady) setSel(p);
  if(dribbleReady){
    const pt=new THREE.Vector3();
    if(ray.ray.intersectPlane(floorPlane,pt)){
      mode="dribble";
      dribbler=ballOwner;
      dribbleFrom.copy(pt);
      pushUndo();
      /* 長押し(350ms):
         ボール自体を押していた → ボールだけを自由に動かす(相手ボールにもできる)
         保持者の体を押していた → パス照準モード */
      if(holdTimer)clearTimeout(holdTimer);
      holdTimer=setTimeout(()=>{
        if(mode==="dribble"&&moved<10){
          if(onBall){
            mode="ball";
            dribbler=null;
            setSel(null);
            if(state.phase!=="base"&&state.holder){state.holder=null;renderStrip();}
          }else{
            mode="passAim";
            showAim(ball.position.x,ball.position.z);
          }
        }
      },350);
      return;
    }
  }
  if(onBall){
    pushUndo();   // ドラッグ開始時点を記録
    mode="ball";
    if(state.phase!=="base"&&state.holder){state.holder=null;renderStrip();}
    return;
  }
  if(p){
    mode="drag";dragPlayer=p;
    pushUndo();   // ドラッグ開始時点を記録
    /* ボールを持っていない選手を長押し → 移動指示モード(矢印が出る) */
    if(p!==ballOwner){
      if(runHoldTimer)clearTimeout(runHoldTimer);
      runHoldTimer=setTimeout(()=>{
        if(mode==="drag"&&dragPlayer===p&&moved<10){
          mode="runAim";
          runPlayer=p;
          dragPlayer=null;
          setSel(p);
          runTrail=[[p.mesh.position.x,p.mesh.position.z]];
          showAim(p.mesh.position.x,p.mesh.position.z);
        }
      },350);
    }
  }
  else mode="orbit";
});
el.addEventListener("pointermove",e=>{
  const prev=pointers.get(e.pointerId);if(!prev)return;
  const dx=e.clientX-prev.x,dy=e.clientY-prev.y;
  moved+=Math.abs(dx)+Math.abs(dy);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(mode==="pinch"&&pointers.size===2){
    const d=pinchDist();
    camGoal.radius=clamp(camGoal.radius*(lastPinch/d),34,420);
    lastPinch=d;
  }else if(mode==="draw"&&drawStart){
    setNDC(e);
    ray.setFromCamera(ndc,camera);
    const pt=new THREE.Vector3();
    if(ray.ray.intersectPlane(floorPlane,pt)){
      if(drawPreview)scene.remove(drawPreview);
      drawPreview=buildDraw({t:state.tool,a:drawStart,b:[pt.x,pt.z]});
    }
  }else if(mode==="ball"){
    setNDC(e);
    ray.setFromCamera(ndc,camera);
    const pt=new THREE.Vector3();
    if(ray.ray.intersectPlane(floorPlane,pt)){
      ballFree.set(clamp(pt.x,-PITCH.wid/2-2,PITCH.wid/2+2),0.45,clamp(pt.z,-PITCH.len/2-2,PITCH.len/2+2));
    }
  }else if(mode==="drag"&&dragPlayer){
    setNDC(e);
    ray.setFromCamera(ndc,camera);
    const pt=new THREE.Vector3();
    if(ray.ray.intersectPlane(floorPlane,pt)){
      pt.x=clamp(pt.x,-PITCH.wid/2-2,PITCH.wid/2+2);
      pt.z=clamp(pt.z,-PITCH.len/2-2,PITCH.len/2+2);
      if(state.ui==="scene")dragPlayer.target.set(pt.x,0,pt.z);
      else dragPlayer.manual.copy(pt).sub(dragPlayer.base);
      simpleFollow(dragPlayer,pt.x,pt.z);
    }
  }else if(mode==="runAim"){
    setNDC(e);
    ray.setFromCamera(ndc,camera);
    const pt=new THREE.Vector3();
    if(ray.ray.intersectPlane(floorPlane,pt)){
      showAim(pt.x,pt.z);
      const last=runTrail[runTrail.length-1];
      if(Math.hypot(pt.x-last[0],pt.z-last[1])>1.6)runTrail.push([pt.x,pt.z]);
    }
  }else if(mode==="passAim"){
    setNDC(e);
    ray.setFromCamera(ndc,camera);
    const pt=new THREE.Vector3();
    if(ray.ray.intersectPlane(floorPlane,pt))showAim(pt.x,pt.z);
  }else if(mode==="dribble"){
    /* ドリブル: 選手とボールが一緒についてくる */
    setNDC(e);
    ray.setFromCamera(ndc,camera);
    const pt=new THREE.Vector3();
    if(ray.ray.intersectPlane(floorPlane,pt)){
      pt.x=clamp(pt.x,-PITCH.wid/2-2,PITCH.wid/2+2);
      pt.z=clamp(pt.z,-PITCH.len/2-2,PITCH.len/2+2);
      const dbP=dribbler||state.sel;
      if(!dbP)return;
      if(state.ui==="scene")dbP.target.set(pt.x,0,pt.z);
      else dbP.manual.copy(pt).sub(dbP.base);
      /* ボールは進行方向の少し前(足元)に置く。止まっているときは攻撃方向へ */
      let vx=pt.x-dribbleFrom.x, vz=pt.z-dribbleFrom.z;
      const vlen=Math.hypot(vx,vz);
      if(vlen>0.05){ vx/=vlen; vz/=vlen; }
      else { vx=0; vz=(dbP.side==="own"?1:-1); }
      ballFree.set(pt.x+vx*1.0,0.45,pt.z+vz*1.0);
      dribbleFrom.set(pt.x,0,pt.z);
      simpleFollow(dbP,pt.x,pt.z);
    }
  }else if(mode==="orbit"){
    camGoal.theta-=dx*0.0045;
    camGoal.phi=clamp(camGoal.phi-dy*0.0038,0.08,1.42);
    if(state.cam!=="free"){
      state.cam="free";
      $$("#camRow .chip[data-cam]").forEach(x=>x.classList.remove("on"));
      document.getElementById("viewBadge").textContent="自由視点";
    }
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(holdTimer){clearTimeout(holdTimer);holdTimer=null;}
  if(runHoldTimer){clearTimeout(runHoldTimer);runHoldTimer=null;}
  if(mode==="runAim"){
    hideAim();
    setNDC(e);
    ray.setFromCamera(ndc,camera);
    const pt=new THREE.Vector3();
    if(ray.ray.intersectPlane(floorPlane,pt)&&runPlayer){
      pt.x=clamp(pt.x,-PITCH.wid/2-2,PITCH.wid/2+2);
      pt.z=clamp(pt.z,-PITCH.len/2-2,PITCH.len/2+2);
      const full=[...runTrail,[pt.x,pt.z]];
      const totalLen=full.reduce((s,p2,i)=>i? s+Math.hypot(p2[0]-full[i-1][0],p2[1]-full[i-1][1]):0,0);
      if(totalLen>1.5){
        const pts=simplifyTrail(full);   // 折れ線として自然な本数まで間引く
        const d={t:"dash",a:pts[0],b:pts[pts.length-1],pts};
        d.g=buildDraw(d);
        draws.push(d);
        execDraw(d);      // 選手が経由点を順にたどって走り、マーカーが追従し、完了後に矢印が消える
      }
    }
    runPlayer=null;
    runTrail=[];
    mode=pointers.size===2?"pinch":null;
    return;
  }
  if(mode==="passAim"){
    hideAim();
    setNDC(e);
    ray.setFromCamera(ndc,camera);
    const pt=new THREE.Vector3();
    if(ray.ray.intersectPlane(floorPlane,pt)){
      pt.x=clamp(pt.x,-PITCH.wid/2-2,PITCH.wid/2+2);
      pt.z=clamp(pt.z,-PITCH.len/2-2,PITCH.len/2+2);
      if(Math.hypot(pt.x-ball.position.x,pt.z-ball.position.z)>2)passBallTo(pt.x,pt.z);
    }
    mode=pointers.size===2?"pinch":null;
    return;
  }
  if(mode==="draw"){
    if(drawPreview){scene.remove(drawPreview);drawPreview=null;}
    if(drawStart){
      pushUndo();
      setNDC(e);
      ray.setFromCamera(ndc,camera);
      const pt=new THREE.Vector3();
      if(ray.ray.intersectPlane(floorPlane,pt)&&
         Math.hypot(pt.x-drawStart[0],pt.z-drawStart[1])>1.2){
        const d={t:state.tool,a:drawStart,b:[pt.x,pt.z]};
        d.g=buildDraw(d);
        draws.push(d);
        execDraw(d);
      }
      drawStart=null;
    }
    pointers.delete(e.pointerId);
    mode=pointers.size===2?"pinch":null;
    return;
  }
  const nowU=performance.now();
  const isTap=moved<8&&nowU-downAt<400;
  if(dragPlayer){
    if(isTap){
      if(lastTap.p===dragPlayer&&nowU-lastTap.t<400){
        pushUndo();
        openEditor(dragPlayer);                 // ダブルタップ → 背番号・名前・利き足の編集
        lastTap={p:null,t:0};
      }else{
        if(state.sel && dragPlayer!==state.sel && dragPlayer.side!==state.sel.side){
          /* 選択中に相手側の選手をタップ → マッチアップを結び直す */
          pushUndo();
          bindMark(state.sel,dragPlayer);
          updateMatchup();
        }else{
          /* 同じ選手をもう一度タップ → 選択解除 / 味方をタップ → 選択を移す */
          setSel(dragPlayer===state.sel?null:dragPlayer);
        }
        lastTap={p:dragPlayer,t:nowU};
      }
    }else setSel(dragPlayer);
    dragPlayer=null;
  }else if(mode==="orbit"&&isTap&&state.sel&&state.tool==="none"){
    /* 選択中に地面タップ → その選手がそこへ走る */
    pushUndo();
    setNDC(e);
    ray.setFromCamera(ndc,camera);
    const pt=new THREE.Vector3();
    if(ray.ray.intersectPlane(floorPlane,pt)){
      pt.x=clamp(pt.x,-PITCH.wid/2-2,PITCH.wid/2+2);
      pt.z=clamp(pt.z,-PITCH.len/2-2,PITCH.len/2+2);
      if(state.ui==="scene")state.sel.target.set(pt.x,0,pt.z);
      else state.sel.manual.copy(pt).sub(state.sel.base);
      simpleFollow(state.sel,pt.x,pt.z);
    }
  }
  mode=pointers.size===2?"pinch":null;
}

/* ================= 描画ツール(矢印/点線ラン/エリア) ================= */
let draws=[];          // {t,a:[x,z],b:[x,z],g:Group}
let drawStart=null, drawPreview=null;
function flatGeo(w,l){const g=new THREE.PlaneGeometry(w,l);g.rotateX(Math.PI/2);return g;}
function buildDraw(d){
  const g=new THREE.Group();
  const col=0xffe08a;
  const mat=()=>new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.9,side:THREE.DoubleSide});
  if(d.t==="area"){
    const [ax,az]=d.a,[bx,bz]=d.b;
    const dx=bx-ax,dz=bz-az;
    const m=new THREE.Mesh(flatGeo(Math.abs(dx)||1,Math.abs(dz)||1),
      new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.2,side:THREE.DoubleSide}));
    m.position.set((ax+bx)/2,0.12,(az+bz)/2);
    g.add(m);
  }else{
    /* pts があれば折れ線(複数区間)。無ければ従来どおり2点間の直線。
       矢印の先端は経路全体の一番最後だけに付く。 */
    const pts = d.pts && d.pts.length>=2 ? d.pts : [d.a,d.b];
    const seg=(ax,az,l,off,ang)=>{
      const m=new THREE.Mesh(flatGeo(0.45,l),mat());
      m.rotation.y=ang;
      const [dx,dz]=[Math.sin(ang),Math.cos(ang)];
      m.position.set(ax+dx*(off+l/2),0.15,az+dz*(off+l/2));
      g.add(m);
    };
    for(let i=0;i<pts.length-1;i++){
      const [ax,az]=pts[i],[bx,bz]=pts[i+1];
      const dx=bx-ax,dz=bz-az,len=Math.max(0.1,Math.hypot(dx,dz));
      const ang=Math.atan2(dx,dz);
      const isLast=(i===pts.length-2);
      const shaft=isLast?Math.max(0.1,len-1.5):len;
      if(d.t==="dash"){for(let o=0;o<shaft;o+=2.0)seg(ax,az,Math.min(1.2,shaft-o),o,ang);}
      else seg(ax,az,shaft,0,ang);
      if(isLast){
        const head=new THREE.Mesh(new THREE.ConeGeometry(0.8,1.5,3),mat());
        head.geometry.rotateX(Math.PI/2);
        head.rotation.y=ang;
        head.position.set(ax+dx/len*(len-0.75),0.15,az+dz/len*(len-0.75));
        g.add(head);
      }
    }
  }
  scene.add(g);
  return g;
}
function clearDraws(){
  draws.forEach(d=>scene.remove(d.g));
  draws=[];
}
function restoreDraws(list){
  clearDraws();
  (list||[]).forEach(d=>{
    const nd={t:d.t,a:d.a.slice(),b:d.b.slice()};
    nd.g=buildDraw(nd);
    draws.push(nd);
  });
}
function eraseAt(pt){
  let best=null,bd=3.0;
  draws.forEach(d=>{
    const mx=(d.a[0]+d.b[0])/2,mz=(d.a[1]+d.b[1])/2;
    const dd=Math.min(
      Math.hypot(pt.x-mx,pt.z-mz),
      Math.hypot(pt.x-d.a[0],pt.z-d.a[1]),
      Math.hypot(pt.x-d.b[0],pt.z-d.b[1]));
    if(dd<bd){bd=dd;best=d;}
  });
  if(best){scene.remove(best.g);draws=draws.filter(d=>d!==best);}
}

/* 描画=指示: 引いた線がそのままプレーになる */
function movePlayerTo(p,x,z){
  p.runQueue=null;   // 単発の目的地指示なので、折れ線の経由点キューは解除
  if(state.ui==="scene")p.target.set(x,0,z);
  else p.manual.set(x-p.base.x,0,z-p.base.z);

/* 折れ線の経由点をキューにして、選手がそれを順番にたどって走るようにする。
   既存のrunTo(プレスなど1点だけの指示)と共通の仕組みに乗せる。 */
function setRunPath(p,points){
  if(!points.length)return;
  p.runQueue=points.length>1 ? points.slice(1).map(pt=>new THREE.Vector3(pt[0],0,pt[1])) : null;
  p.runTo=new THREE.Vector3(points[0][0],0,points[0][1]);
}
function scheduleDrawFade(d, delayMs){
  setTimeout(()=>{
    if(!draws.includes(d))return;
    const fade=()=>{
      let done=true;
      d.g.traverse(o=>{
        if(o.material){
          o.material.opacity=Math.max(0,(o.material.opacity??0.9)-0.06);
          if(o.material.opacity>0.01)done=false;
        }
      });
      if(done){
        scene.remove(d.g);
        draws=draws.filter(x=>x!==d);
      }else requestAnimationFrame(fade);
    };
    fade();
  }, delayMs);
}
/* 長押しでなぞった軌跡を、折れ線として自然な本数(最大5点)に間引く。
   点が少ない/短ければそのまま使う。 */
function simplifyTrail(pts){
  if(pts.length<=5)return pts;
  const MAXP=5;
  const cum=[0];
  for(let i=1;i<pts.length;i++)
    cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const total=cum[cum.length-1];
  const out=[pts[0]];
  for(let k=1;k<MAXP-1;k++){
    const target=total*k/(MAXP-1);
    let i=1;while(i<cum.length&&cum[i]<target)i++;
    out.push(pts[Math.min(i,pts.length-1)]);
  }
  out.push(pts[pts.length-1]);
  return out;
}
function execDraw(d){
  const [ax,az]=d.a,[bx,bz]=d.b;
  if(d.t==="dash"){
    /* 選手の動き: 始点にいる選手が経由点をたどって終点へ走る(折れ線対応)。
       静的モードではマーク相手も一緒についていく。 */
    let best=null,bd=4.5;
    players.forEach(p=>{
      const dd=Math.hypot(p.mesh.position.x-ax,p.mesh.position.z-az);
      if(dd<bd){bd=dd;best=p;}
    });
    if(!best)return;
    const path=(d.pts&&d.pts.length>2)?d.pts.slice(1):[[bx,bz]];
    setRunPath(best,path);
    /* マークしている相手も同じ折れ線を追って一緒についていく(双方向に探索)。
       これは指導者が明示的に指示した動きなので、「守備連動」トグルが
       OFF(受動的なゾーンスライド・プレスを止める設定)の時でも常に反応する。
       各経由点をゴール側へ少しオフセットした位置に変換して追従させる。 */
    const marker=markPartnerOf(best);
    if(marker&&marker.side!==best.side){
      const gs=marker.side==="own"?-2.2:2.2;
      const markPath=path.map(pt=>[pt[0]*0.95,pt[1]+gs]);
      setRunPath(marker,markPath);
    }
    const totalLen=(d.pts&&d.pts.length>1)
      ? d.pts.reduce((s,p2,i)=>i?s+Math.hypot(p2[0]-d.pts[i-1][0],p2[1]-d.pts[i-1][1]):0,0)
      : Math.hypot(bx-ax,bz-az);
    scheduleDrawFade(d, clamp(totalLen/7.4,0.4,4)*1000+500);
  }else if(d.t==="arrow"){
    /* ボールの動き: ボールが終点へ。スペースなら最寄りの選手が追いかける */
    const toV=new THREE.Vector3(bx,0.45,bz);
    const dist=ball.position.distanceTo(toV);
    flight={t0:performance.now(),dur:clamp(dist/16,0.25,1.6)*1000,
      from:ball.position.clone(),toP:null,toV,h:clamp(dist*0.10,0.25,3.2)};
    ballFree.copy(toV);
    let best=null,bd=1e9;
    players.forEach(p=>{
      const dd=Math.hypot(p.mesh.position.x-bx,p.mesh.position.z-bz);
      if(dd<bd){bd=dd;best=p;}
    });
    if(best&&bd>3)movePlayerTo(best,bx,bz);
    if(state.ui==="play"){
      state.holder=(best&&best.side===currentPoss()&&bd<=7)?best:null;
      renderStrip();
    }
    scheduleDrawFade(d, clamp(dist/16,0.25,1.6)*1000+500);
  }
}

const rec={on:false,frames:[],lastT:0,playing:false,playIdx:0,playTimer:null};
function recSample(){
  return {
    t: performance.now()-rec.t0,
    P: players.map(p=>[p.mesh.position.x,p.mesh.position.z]),

  if(!rec.on)return;

    $("#recStatus").textContent=rec.frames.length?`${(rec.frames[rec.frames.length-1].t/1000).toFixed(1)}秒`:"";

/* 毎フレーム呼ばれる補間再生: 記録点の"間"を滑らかに繋ぐ(スナップしない) */
function recPlayTick(){
  if(!rec.playing)return;
  const el=(performance.now()-rec.playT0)*(state.slow?0.35:1);
  const fr=rec.frames;
  const last=fr[fr.length-1].t;
  if(el>=last){
    const f=fr[fr.length-1];
    f.P.forEach((v,i)=>{ if(players[i])players[i].mesh.position.set(v[0],players[i].mesh.position.y,v[1]); });
    ball.position.set(f.B[0],0.45,f.B[1]);
    recStopPlay();
    return;
  }
  let i=0;
  while(i<fr.length-2&&fr[i+1].t<el)i++;
  const a=fr[i],b=fr[i+1];
  const span=Math.max(1,b.t-a.t);
  const t=clamp((el-a.t)/span,0,1);
  a.P.forEach((v,idx)=>{
    const p=players[idx];if(!p)return;
    const bv=b.P[idx];
    p.mesh.position.x=v[0]+(bv[0]-v[0])*t;
    p.mesh.position.z=v[1]+(bv[1]-v[1])*t;
    p.base.set(p.mesh.position.x,0,p.mesh.position.z);
    p.target.set(p.mesh.position.x,0,p.mesh.position.z);
  });
  ball.position.x=a.B[0]+(b.B[0]-a.B[0])*t;
  ball.position.z=a.B[1]+(b.B[1]-a.B[1])*t;
  ball.position.y=0.45;
  ballFree.copy(ball.position);ballTarget.copy(ball.position);
}

/* ================= Undo(状態スナップショット) =================
   配置モードは毎フレーム座標を再計算するため、絶対座標を戻しても
   次のフレームで上書きされてしまう。そこで「基準位置からのズレ(manual)」
   と「マーク固定」「ボールの自由位置」など、エンジンが尊重する
   "相対的な状態"だけを記録・復元する。 */
const undoStack=[];
let undoBusy=false;
function snapshot(){
  return {
    baseLayout:state.baseLayout,
    ownF:state.ownF,oppF:state.oppF,
    ballFree:[ballFree.x,ballFree.z],
    manual:players.map(p=>[p.manual.x,p.manual.z]),
    marks:players.map(p=>({fixed:!!p.pMarkFixed,idx:p.pMark?players.indexOf(p.pMark):-1})),
    num:players.map(p=>p.num),
    name:players.map(p=>p.name),
    D:draws.map(d=>({t:d.t,a:d.a,b:d.b}))
  };
}
function pushUndo(){
  if(undoBusy)return;
  undoStack.push(snapshot());
  if(undoStack.length>40)undoStack.shift();
  $("#undoBtn").disabled=false;
  $("#undoBtn").style.opacity=1;
}
function applySnapshot(s){
  undoBusy=true;
  state.baseLayout=s.baseLayout;
  $$("#presetRow .chip[data-bl]").forEach(x=>x.classList.toggle("on",x.dataset.bl===s.baseLayout));
  if(state.ownF!==s.ownF||state.oppF!==s.oppF){
    state.ownF=s.ownF;state.oppF=s.oppF;fillSelects();rebuild();
  }
  players.forEach((p,i)=>{
    if(s.manual[i]){p.manual.set(s.manual[i][0],0,s.manual[i][1]);}
    if(s.num&&s.num[i]!==undefined&&(p.num!==s.num[i]||p.name!==s.name[i])){
      p.num=s.num[i];p.name=s.name[i];refreshTag(p);
    }
  });
  players.forEach((p,i)=>{
    const m=s.marks&&s.marks[i];
    if(!m){p.pMarkFixed=false;return;}
    p.pMarkFixed=m.fixed;
    p.pMark=m.idx>=0?players[m.idx]:(p.pMarkFixed?p.pMark:null);
  });
  ballFree.set(s.ballFree[0],0.45,s.ballFree[1]);
  ball.position.copy(ballFree);ballTarget.copy(ballFree);
  restoreDraws(s.D);
  renderStrip();
  updateMatchup();
  setSel(null);
  undoBusy=false;
}
function undo(){
  if(!undoStack.length)return;
  applySnapshot(undoStack.pop());
  $("#undoBtn").disabled=undoStack.length===0;
  $("#undoBtn").style.opacity=undoStack.length?1:0.5;
}

/* 原則マーク表: 「自分の担当レーンにいる、1つ前のラインの相手」を基本則に、
   ミラーx最近傍で1対1対応。余った攻撃者=構造的フリーマン。
   (主要ペアの手書き上書きは PRINCIPLE_OVERRIDES に今後追加) */
const PRINCIPLE_OVERRIDES={};
function computePrinciple(){
  const sideMarks=(defSide)=>{
    const atkSide=defSide==="own"?"opp":"own";
    const dls=[LINE1,LINE2,LINE3], als=[LINE3,LINE2,LINE1];
    players.filter(p=>p.side===defSide).forEach(p=>p.pMark=null);
    for(let i=0;i<3;i++){
      const dsAll=players.filter(p=>p.side===defSide&&dls[i].has(p.def.slot));
      const ds=dsAll.filter(p=>!p.pMarkFixed);
      const atkUsed=new Set(dsAll.filter(p=>p.pMarkFixed).map(p=>p.pMark).filter(Boolean));
      const as=players.filter(p=>p.side===atkSide&&als[i].has(p.def.slot)&&!atkUsed.has(p));
      /* 交差禁止: 両者をレーン順に並べ、ズレ量(オフセット)だけ総距離最小で選ぶ */
      const X=p=>p.side===defSide?p.def.b[0]:100-p.def.b[0];
      ds.sort((a,b)=>X(a)-X(b));
      as.sort((a,b)=>X(a)-X(b));
      if(ds.length&&as.length){
        const dBig=ds.length>=as.length;
        const big=dBig?ds:as, small=dBig?as:ds;
        let bestOff=0,bestC=1e9;
        for(let off=0;off<=big.length-small.length;off++){
          let c=0;
          for(let j=0;j<small.length;j++)c+=Math.abs(X(small[j])-X(big[j+off]));
          if(c<bestC){bestC=c;bestOff=off;}
        }
        for(let j=0;j<small.length;j++){
          if(dBig)big[j+bestOff].pMark=small[j];
          else small[j].pMark=big[j+bestOff];
        }
      }
    }
  };
  sideMarks("own");sideMarks("opp");
}

/* 受け手へのアプローチ位置を決める。
   ルール:
   ① 必ず受け手と自陣ゴールの間に立つ(追い越さない)
   ② 間に合う度合い(守備者の到達時間 ÷ ボールの到達時間)で間合いを変える
      ・余裕をもって間に合う → 1.6mまでタイトに寄せる
      ・ぎりぎり           → 3.5mで止めて遅らせる
      ・間に合わない       → 6mまで引いてカバーに回る
   ③ 走る速度は最大7.4m/s、ボールは約18m/s */
function approachReceiver(marker,rec,ballDist){
  const goalZ = marker.side==="own" ? -PITCH.len/2 : PITCH.len/2;  // 自陣ゴール方向
  const rx=rec.mesh.position.x, rz=rec.mesh.position.z;
  const ballTime = Math.max(0.25, (ballDist||0)/18);               // ボール到達時間(秒)
  const runDist  = Math.hypot(marker.mesh.position.x-rx, marker.mesh.position.z-rz);
  const runTime  = runDist/7.4;                                    // 守備者の到達時間(秒)
  const ratio    = runTime/ballTime;                               // 1未満なら余裕で間に合う
  let gap;
  if(ratio<=1.0)      gap=1.6;    // 間に合う → タイトに寄せる
  else if(ratio<=1.8) gap=3.5;    // ぎりぎり → 遅らせる
  else                gap=6.0;    // 間に合わない → 引いてカバー
  /* ①受け手とゴールを結ぶ線上、ゴール側に gap だけ離れて立つ。
     手動オフセットとは加算されない走行指示(runTo)で出す。 */
  const dirZ = (goalZ>rz) ? 1 : -1;
  marker.manual.set(0,0,0);
  marker.runQueue=null;                        // 古い折れ線の経由点を残さない
  marker.runTo=new THREE.Vector3(
    rx*0.97, 0,
    clamp(rz + dirZ*gap, -PITCH.len/2+1, PITCH.len/2-1));
}

/* 指定地点へパス。近くに味方がいればその足元へ吸い付く */
function passBallTo(tx,tz){
  let rec=null,bd=6.0;
  const side=currentPoss();
  players.forEach(p=>{
    if(p.side!==side||p===state.sel)return;
    const d=Math.hypot(p.mesh.position.x-tx,p.mesh.position.z-tz);
    if(d<bd){bd=d;rec=p;}
  });
  if(rec){ tx=rec.mesh.position.x; tz=rec.mesh.position.z; }
  const toV=new THREE.Vector3(tx,0.45,tz);
  const d=ball.position.distanceTo(toV);
  flight={t0:performance.now(),el:0,dur:clamp(d/18,0.25,1.4)*1000,
    from:ball.position.clone(),toP:null,toV,h:clamp(d*0.10,0.3,3.2)};
  ballFree.copy(toV);
  if(rec){
    setSel(rec);
    /* パスが出た瞬間から、受け手のマーカーがアプローチを開始する。
       「守備者が走る時間」と「ボールが届く時間」を比べ、
       間に合う度合いで寄せる間合いを決める(行きすぎを防ぐ) */
    const marker=markPartnerOf(rec);
    if(marker&&marker.side!==rec.side&&state.defenseLive){
      approachReceiver(marker,rec,d);
    }
    return;
  }
  /* スペースへのパス: 落下点に最も近い選手が全力で追いかける
     (走る速度は描画側で最大7.4m/sに制限されるので、距離に応じた時間がかかる) */
  let chaser=null,cd=1e9;
  players.forEach(p=>{
    if(p===state.sel)return;
    const dd=Math.hypot(p.mesh.position.x-tx,p.mesh.position.z-tz);
    if(dd<cd){cd=dd;chaser=p;}
  });
  if(chaser){
    movePlayerTo(chaser,tx,tz);
    setSel(chaser);
  }
}

/* 選択中の選手とマッチアップしている相手を返す(双方向に探索) */
function markPartnerOf(p){
  if(!p)return null;
  if(p.pMark)return p.pMark;
  return players.find(q=>q.pMark===p)||null;
}
/* マッチアップを双方向に結び直す(1対1を保つ) */
function bindMark(a,b){
  players.forEach(q=>{
    if(q.pMark===a||q.pMark===b)q.pMark=null;
  });
  a.pMark=b; a.pMarkFixed=true;
  b.pMark=a; b.pMarkFixed=true;
}

/* シンプル盤: 攻撃側の選手を(x,z)へ動かした時、マーク相手をゴール側へ連れて行く。
   守備側の選手を動かしてもマーク相手は引っ張らない(自由に配置できる)。 */
function simpleFollow(p,x,z){
  if(!state.simple||!p)return;
  if(p.side!==currentPoss())return;
  const mk=markPartnerOf(p);
  if(!mk||mk.side===p.side)return;
  const gs=mk.side==="own"?-3.4:3.4;   /* 少し離れてついてくる間合い */
  const wx=clamp(x*0.92,-PITCH.wid/2+1,PITCH.wid/2-1);
  const wz=clamp(z+gs,-PITCH.len/2+1,PITCH.len/2-1);
  if(state.ui==="scene")mk.target.set(wx,0,wz);
  else mk.manual.set(wx-mk.base.x,0,wz-mk.base.z);
}

/* メンバー表「1本目」のスタメンを自チームへ反映。
   adoptForm=true なら1本目のフォーメーションにも合わせる */
function syncFromMembers(adoptForm){
  if(membersSyncing)return false;
  const mb=loadMembers();
  if(!mb||(mb.mode||"11")!==state.mode)return false;
  const b=mb.boards&&mb.boards[0];
  const roster=mb.rosters?mb.rosters[state.mode]:mb.roster;
  if(!b||!roster||!b.assign||!Object.keys(b.assign).length)return false;
  if(adoptForm&&F[b.form]&&state.ownF!==b.form){
    membersSyncing=true;
    state.ownF=b.form;
    $("#ownFormation").value=b.form;
    rebuild();
    membersSyncing=false;
  }
  if(state.ownF!==b.form)return false;
  const own=players.filter(p=>p.side==="own");
  let changed=false;
  Object.entries(b.assign).forEach(([si,ri])=>{
    const p=own[+si];
    /* 新形式{r,i}=カテゴリー横断参照 / 旧形式(数値)=現在のロスター */
    const m=(ri&&typeof ri==="object")
      ?((mb.rosters&&mb.rosters[ri.r]||[])[ri.i])
      :roster[ri];
    if(!p||!m)return;
    const n=parseInt(m.num,10);
    const nm=String(m.name||"").trim().slice(0,8);
    if(n>=1&&n<=99&&(p.num!==n||p.name!==nm)&&!p.nameEdited){
      p.num=n;p.name=nm;refreshTag(p);changed=true;
    }
  });
  if(changed)renderStrip();
  return changed;
}
function applyRosterNames(){
  const roster=loadRoster();

  players.filter(p=>p.side==="own"&&!p.nameEdited).forEach(p=>{
    const m=roster.find(r=>parseInt(r.num,10)===p.num&&String(r.name||"").trim());
    const nm=m?String(m.name).trim().slice(0,8):p.name;
    if(nm!==p.name){p.name=nm;refreshTag(p);changed=true;}
  });
  return changed;
}

/* ========================= ループ ========================= */
/* 実測FPSが低い端末では描画品質を段階的に落とす(戻さない=ちらつき防止)。
   起動直後のスパイクを避けるため2秒待ってから、90フレーム平均で判定。
   1段階目: 解像度を等倍に / 2段階目: 影を切る */
let perfAcc=0,perfN=0,perfLevel=0,perfWarm=0;
function perfTick(avg){
  if(avg<=0.026||perfLevel>=2)return;
  perfLevel++;
  if(perfLevel===1){
    renderer.setPixelRatio(1);
  }else{
    renderer.shadowMap.enabled=false;
    sun.castShadow=false;
    scene.traverse(o=>{
      if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.needsUpdate=true);
    });
  }
}
function animate(){
  requestAnimationFrame(animate);
  applyDynamic();
  const nowT=performance.now();
  const rawDt=Math.min(0.1,(nowT-lastT)/1000);lastT=nowT;
  const dt=rawDt*(state.slow?0.35:1);
  if(perfWarm<120)perfWarm++;
  else{perfAcc+=rawDt;if(++perfN>=90){perfTick(perfAcc/perfN);perfAcc=0;perfN=0;}}
  const selPartner=markPartnerOf(state.sel);
  const attackSide=currentPoss();   // ボールに最も近い選手のチーム=攻撃側
  players.forEach(p=>{
    let runDir=false,spd=0;
    if(!rec.playing){
      /* 走って移動: 遠い=スプリント / 近い=減速して収まる */
      const tx=p.target.x-p.mesh.position.x, tz=p.target.z-p.mesh.position.z;
      const dist=Math.hypot(tx,tz);
      if(dist>0.002){
        const maxV=p===dragPlayer?40:7.4;      // 選手の最高速度 7.4m/s
        const v=Math.min(maxV,dist*3.2);
        const step=Math.min(dist,v*dt);
        p.mesh.position.x+=tx/dist*step;
        p.mesh.position.z+=tz/dist*step;
        runDir=dist>1.6;
        spd=Math.min(v,7.4);
      }
      /* 走りアニメ: 脚の振り子+前傾+バウンド(速度連動) */
      const runK=spd/7.4;
      p.runPhase+=spd*dt*3.1;
      const sw=Math.sin(p.runPhase)*0.62*runK;
      p.legL.rotation.x=sw;
      p.legR.rotation.x=-sw;
      p.figure.rotation.x=0.16*runK;
      p.figure.position.y=Math.abs(Math.sin(p.runPhase))*0.07*runK;
      /* 体の向き: 走行中は進行方向 / 保持者は攻撃方向 / それ以外はボール */
      const isHolder=(p===ballHolder);
      const fdx=runDir?tx:(isHolder?0:ball.position.x-p.mesh.position.x);
      const fdz=runDir?tz:(isHolder?(p.side==="own"?1:-1):ball.position.z-p.mesh.position.z);
      if(fdx*fdx+fdz*fdz>0.5){
        const tr=Math.atan2(fdx,fdz);
        let dr=tr-p.figure.rotation.y;
        dr=Math.atan2(Math.sin(dr),Math.cos(dr));
        p.figure.rotation.y+=dr*(runDir?0.16:0.08);
      }
    }
    /* 円の色: 緑=タップした選手 / 赤=その選手のマッチアップ相手 /
       それ以外は控えめなチーム色。マッチアップは選択時のみ強調される。 */
    const isSel=(p===state.sel);
    const isPartner=(selPartner&&p===selPartner);
    p.disc.material.color.setHex(
      isSel?0x37d67a: isPartner?0xff4d4d: COLORS[p.side].ring);
    p.disc.visible=state.rings;
    p.disc.material.opacity=
      isSel?1.0:
      isPartner?0.95:
      p===dragPlayer?0.5:0.22;
  });
  /* ボール: パス中は浮き球の軌道、それ以外はターゲット追従 */
  if(flight){
    flight.el=(flight.el||0)+dt*1000;
    const ft=flight.el/flight.dur;
    if(ft>=1){flight=null;}
    else{
      const to=flight.toP?flight.toP.mesh.position:flight.toV;
      ball.position.x=flight.from.x+(to.x-flight.from.x)*ft;
      ball.position.z=flight.from.z+(to.z-flight.from.z)*ft;
      ball.position.y=0.45+Math.sin(Math.PI*ft)*flight.h;
    }
  }
  if(!flight)ball.position.lerp(ballTarget,0.18);
  ballHit.position.copy(ball.position);
  /* 選択マーカー(▽) */
  if(state.sel){
    selMarker.position.set(
      state.sel.mesh.position.x,
      (PITCH.len===105?1.65:1.4)+3.6+Math.sin(nowT*0.005)*0.18,
      state.sel.mesh.position.z);
    selMarker.rotation.y+=0.02;
  }
  recTick();
  recPlayTick();
  updateMatchup();
  updateLanes();
  updateCover();
  updateSpace();
  updateRadar();
  updateUnitChains();
  for(let i=effects.length-1;i>=0;i--){
    const fx=effects[i];
    fx.life-=0.03;
    fx.line.material.opacity=fx.life*0.9;
    if(fx.life<=0){scene.remove(fx.line);effects.splice(i,1);}
  }
  updateCamera();
  renderer.render(scene,camera);
}

  set(k,v){try{localStorage.setItem(k,v)}catch(e){this._m[k]=v}}
};
function captureFrame(){
  return {
    P:players.map(p=>[+p.mesh.position.x.toFixed(2),+p.mesh.position.z.toFixed(2)]),
    B:[+ball.position.x.toFixed(2),+ball.position.z.toFixed(2)],
    D:draws.map(d=>({t:d.t,a:d.a,b:d.b}))
  };
}
function loadFrame(i,animateBall=true){
  const f=state.frames[i];
  if(!f)return;
  state.curFrame=i;
  f.P.forEach((xy,j)=>{
    if(players[j])players[j].target.set(xy[0],0,xy[1]);
  });
  const toV=new THREE.Vector3(f.B[0],0.45,f.B[1]);
  ballFree.copy(toV);
  if(animateBall){
    const d=ball.position.distanceTo(toV);
    if(d>1.5)flight={t0:performance.now(),dur:clamp(d/16,0.25,1.5)*1000,
      from:ball.position.clone(),toP:null,toV,h:clamp(d*0.10,0.25,3.2)};
  }else{ball.position.copy(toV);}
  restoreDraws(f.D);
  renderFrameChips();
}

  });
}

    if(i>=state.frames.length){stopScene();return;}
    const prev=state.frames[i-1],next=state.frames[i];
    let maxD=0;
    next.P.forEach((xy,j)=>{
      maxD=Math.max(maxD,Math.hypot(xy[0]-prev.P[j][0],xy[1]-prev.P[j][1]));
    });
    loadFrame(i);

    playing=setTimeout(step, (maxD/7.4*1000+700)*(state.slow?2.86:1));
  };

});

      try{lastUid=localStorage.getItem(SYNC_UID);}catch(e){}
      const accountChanged=lastUid!==u.uid;
      try{localStorage.setItem(SYNC_UID,u.uid);}catch(e){}
      if(d){
        /* アカウントが変わった直後はts比較せずクラウドを正とする */
        const applied=cloudApply(d,accountChanged);
        if(!applied&&!accountChanged)cloudDoPush();
      }else if(accountChanged&&lastUid){
        /* 共有端末で別の新規アカウントに入った: 前チームのデータを持ち込まない */
        SYNC_KEYS.forEach(k=>{try{localStorage.removeItem(k);}catch(e){}});
        try{localStorage.setItem(SYNC_TS,"0");}catch(e){}
        location.reload();
      }else{
        cloudDoPush();   /* 初回契約: お試しで作ったデータをそのまま引き継ぐ */
      }
      ref.onSnapshot(snap=>{if(snap.exists)cloudApply(snap.data());});
    }).catch(()=>{});
  });
  $("#authBtn").addEventListener("click",()=>{
    if(fbUser){
      if(confirm("ログアウトしますか?(データはこの端末とクラウドに残ります)"))
        firebase.auth().signOut();
      return;
    }
    showLoginBox();
  });
})();

/* チームID+パスワードのログイン画面(チームIDは内部ではメール形式) */
function showLoginBox(){
  const old=document.getElementById("loginBox");
  if(old){old.style.display="flex";return;}
  const w=document.createElement("div");
  w.id="loginBox";
  w.style.cssText="position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6)";
  w.innerHTML=
    '<div style="background:#101b14;border:1px solid rgba(217,182,74,.35);border-radius:14px;padding:18px;width:272px;display:flex;flex-direction:column;gap:10px;font-size:13px">'+
    '<b style="color:#d9b64a;letter-spacing:.1em">チームログイン</b>'+
    '<input id="lgId" placeholder="チームID" autocapitalize="none" autocomplete="username" style="background:#16241d;border:1px solid rgba(217,182,74,.25);border-radius:8px;color:#e9e4d2;padding:10px;font-size:15px">'+
    '<input id="lgPw" type="password" placeholder="パスワード" autocomplete="current-password" style="background:#16241d;border:1px solid rgba(217,182,74,.25);border-radius:8px;color:#e9e4d2;padding:10px;font-size:15px">'+
    '<div id="lgErr" style="color:#ff6b6b;font-size:11px;display:none"></div>'+
    '<button id="lgGo" style="background:#d9b64a;border:none;border-radius:8px;padding:10px;font-weight:700;color:#12200f;font-size:14px">ログイン</button>'+
    '<button id="lgGoogle" style="background:#16241d;border:1px solid rgba(217,182,74,.25);border-radius:8px;padding:9px;color:#e9e4d2;font-size:12px">Googleアカウントでログイン</button>'+
    '<button id="lgCancel" style="background:none;border:none;color:#9aa08e;font-size:12px">ログインせずに試す</button>'+
    '</div>';
  document.body.appendChild(w);
  const err=m=>{const e=document.getElementById("lgErr");e.textContent=m;e.style.display="block";};
  document.getElementById("lgGo").addEventListener("click",()=>{
    let id=document.getElementById("lgId").value.trim();
    const pw=document.getElementById("lgPw").value;
    if(!id||!pw){err("チームIDとパスワードを入力してください");return;}
    if(!id.includes("@"))id+="@gtb.team";
    firebase.auth().signInWithEmailAndPassword(id,pw)
      .then(()=>{w.style.display="none";})
      .catch(()=>err("ログインできません。IDまたはパスワードをご確認ください"));
  });
  document.getElementById("lgGoogle").addEventListener("click",()=>{
    firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())
      .then(()=>{w.style.display="none";})
      .catch(e=>{
        if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"))
          firebase.auth().signInWithRedirect(new firebase.auth.GoogleAuthProvider());
        else err("Googleログインに失敗しました");
      });
  });
  document.getElementById("lgCancel").addEventListener("click",()=>{w.style.display="none";});
}

/* 復帰時にクラウドへ再送 */
addEventListener("online",()=>{if(fbUser)cloudPush();});
</script>
